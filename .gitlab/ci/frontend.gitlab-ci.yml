# Frontend CI jobs for build baseline capture, validation, and dual-bundler parity.

.frontend-test-base:
  image: node:22-bookworm
  before_script:
    - yarn install --frozen-lockfile || yarn install
  cache:
    key: frontend-yarn
    paths:
      - node_modules/

build-webpack:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Building production assets with webpack 4"
    - NODE_ENV=production node node_modules/webpack/bin/webpack.js --config config/webpack.config.js
  artifacts:
    name: webpack-dist
    paths:
      - dist/webpack/
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

build-rspack:
  # WO-021: uses @rspack/cli + @rspack/core from package.json (stable 2.1.x, no RC).
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Building production assets with Rspack"
    - NODE_ENV=production node node_modules/@rspack/cli/bin/rspack.js build --config config/rspack.config.mjs
  artifacts:
    name: rspack-dist
    paths:
      - dist/rspack/
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

bundle-parity:
  extends: .frontend-test-base
  stage: test
  needs:
    - job: build-webpack
      artifacts: true
    - job: build-rspack
      artifacts: true
  script:
    - source scripts/utils.sh
    - log_info "Comparing webpack and Rspack asset manifests"
    - |
      node scripts/frontend/compare_bundles.mjs \
        --manifest-a dist/webpack/asset-manifest.json \
        --manifest-b dist/rspack/asset-manifest.json \
        --output-a dist/webpack \
        --output-b dist/rspack \
        --bundler-a webpack4 \
        --bundler-b rspack
  artifacts:
    name: bundle-parity-reports
    paths:
      - reports/parity/diff-report.md
      - reports/parity/size-table.json
      - reports/parity/parity-defects.json
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

build-baseline:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Recording webpack 4 build baseline"
    - node scripts/frontend/record_build_baseline.mjs
    - node scripts/frontend/validate_baseline.mjs
  artifacts:
    name: webpack4-baseline
    paths:
      - config/parity/webpack4-baseline.json
      - dist/webpack/
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

validate-baseline-schema:
  extends: .frontend-test-base
  stage: test
  script:
    - node scripts/frontend/validate_baseline.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE

size-budget:
  extends: .frontend-test-base
  stage: test
  needs:
    - job: build-webpack
      artifacts: true
  script:
    - source scripts/utils.sh
    - log_info "Checking per-entry bundle size budget against webpack 4 baseline"
    - |
      node scripts/frontend/check_size_budget.mjs \
        --manifest dist/webpack/asset-manifest.json \
        --output dist/webpack
  artifacts:
    name: size-budget-report
    paths:
      - reports/parity/size-budget-report.json
      - reports/parity/size-budget-report.md
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

size-budget-fixture-fail:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Verifying size budget gate fails on oversized fixture entry"
    - |
      set +e
      node scripts/frontend/check_size_budget.mjs \
        --baseline fixtures/frontend/budget/baseline-entry-totals.json \
        --current-totals fixtures/frontend/budget/current-over-budget.json \
        --reports-dir reports/parity/fixture-fail \
        --skip-rebaseline-check
      exit_code=$?
      set -e
      if [ "$exit_code" -ne 1 ]; then
        log_error "Expected size budget gate to exit 1 for oversized fixture, got $exit_code"
        exit 1
      fi
      log_info "Size budget gate correctly failed on oversized fixture"
  artifacts:
    name: size-budget-fixture-fail-report
    paths:
      - reports/parity/fixture-fail/size-budget-report.json
      - reports/parity/fixture-fail/size-budget-report.md
    expire_in: 31d
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE

runtime-smoke:
  extends: .frontend-test-base
  stage: test
  needs:
    - job: build-webpack
      artifacts: true
    - job: build-rspack
      artifacts: true
    - job: bundle-parity
      artifacts: true
  script:
    - source scripts/utils.sh
    - log_info "Running runtime smoke suite against webpack and Rspack outputs"
    - |
      node scripts/frontend/smoke_entry_points.mjs \
        --asset-root dist/webpack \
        --bundler webpack4 \
        --output reports/parity/smoke-results-webpack4.json
    - |
      node scripts/frontend/smoke_entry_points.mjs \
        --asset-root dist/rspack \
        --bundler rspack \
        --output reports/parity/smoke-results-rspack.json
    - |
      node scripts/frontend/smoke_entry_points.mjs \
        --mode diff \
        --results-a reports/parity/smoke-results-webpack4.json \
        --results-b reports/parity/smoke-results-rspack.json \
        --reports-dir reports/parity \
        --parity-defects reports/parity/parity-defects.json
  artifacts:
    name: runtime-smoke-reports
    paths:
      - reports/parity/smoke-results-webpack4.json
      - reports/parity/smoke-results-rspack.json
      - reports/parity/smoke-divergence-report.json
      - reports/parity/parity-defects.json
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

runtime-smoke-fixtures:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Validating smoke harness against committed passing and failing fixtures"
    - |
      node scripts/frontend/smoke_entry_points.mjs \
        --asset-root fixtures/frontend/smoke/passing \
        --bundler fixture-pass \
        --output reports/parity/smoke-results-fixture-pass.json
    - |
      set +e
      node scripts/frontend/smoke_entry_points.mjs \
        --asset-root fixtures/frontend/smoke/failing \
        --bundler fixture-fail \
        --output reports/parity/smoke-results-fixture-fail.json
      exit_code=$?
      set -e
      if [ "$exit_code" -ne 1 ]; then
        log_error "Expected smoke harness to exit 1 for failing fixture, got $exit_code"
        exit 1
      fi
      log_info "Smoke harness correctly failed on failing fixture"
  artifacts:
    name: runtime-smoke-fixture-reports
    paths:
      - reports/parity/smoke-results-fixture-pass.json
      - reports/parity/smoke-results-fixture-fail.json
    expire_in: 31d
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE

frontend-unit-tests:
  extends: .frontend-test-base
  stage: test
  script:
    - yarn test
  rules:
    - if: $CI_PIPELINE_SOURCE

layer-ratchet:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Checking architectural layer violations against committed baseline"
    - node scripts/architecture/check_layer_ratchet.mjs
  artifacts:
    name: layer-ratchet-reports
    paths:
      - reports/architecture/layer-ratchet-progress.json
      - reports/architecture/layer-ratchet-report.md
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

layer-ratchet-fixture-fail:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Verifying layer ratchet gate fails on net-new fixture violation"
    - |
      set +e
      node scripts/architecture/check_layer_ratchet.mjs \
        --baseline fixtures/architecture/layer-baseline.json \
        --current-violations fixtures/architecture/layer-current-net-new.json \
        --reports-dir reports/architecture/fixture-fail
      exit_code=$?
      set -e
      if [ "$exit_code" -ne 1 ]; then
        log_error "Expected layer ratchet gate to exit 1 for net-new fixture, got $exit_code"
        exit 1
      fi
      log_info "Layer ratchet gate correctly failed on net-new fixture"
  artifacts:
    name: layer-ratchet-fixture-fail-report
    paths:
      - reports/architecture/fixture-fail/layer-ratchet-progress.json
      - reports/architecture/fixture-fail/layer-ratchet-report.md
    expire_in: 31d
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE

ruby-ratchet:
  image: ruby:3.2-bookworm
  stage: test
  before_script:
    - apt-get update && apt-get install -y nodejs npm
    - npm install
    - bundle install
  cache:
    key: ruby-ratchet
    paths:
      - vendor/bundle
      - node_modules/
  script:
    - source scripts/utils.sh
    - log_info "Checking Ruby per-directory RuboCop ratchet"
    - node scripts/architecture/check_ruby_ratchet.mjs
  artifacts:
    name: ruby-ratchet-reports
    paths:
      - reports/architecture/ruby-ratchet-report.json
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

# GraphQL schema dump is an input to authz coverage. Retention stays at 30 days;
# the coverage report below is the audit artifact and is kept for 13 months.
graphql-schema-dump:
  image: ruby:3.2-bookworm
  stage: test
  before_script:
    - bundle install
  script:
    - bundle exec rake gitlab:graphql:schema:dump
  artifacts:
    name: graphql-schema-dump
    paths:
      - tmp/tests/graphql/gitlab_schema.graphql
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE

graphql-authz-coverage:
  image: ruby:3.2-bookworm
  stage: test
  needs:
    - job: graphql-schema-dump
      artifacts: true
  before_script:
    - bundle install
  script:
    - bundle exec rake gitlab:graphql:authz_coverage
  artifacts:
    name: graphql-authz-coverage
    paths:
      - tmp/reports/graphql_authz_coverage.json
    expire_in: 13 mos
  rules:
    - if: $CI_PIPELINE_SOURCE

graphql-authz-guard:
  image: ruby:3.2-bookworm
  stage: test
  needs:
    - job: graphql-schema-dump
      artifacts: true
  before_script:
    - bundle install
  script:
    - GRAPHQL_AUTHZ_COVERAGE_MODE=guard bundle exec rake gitlab:graphql:authz_coverage
  artifacts:
    name: graphql-authz-coverage
    when: always
    paths:
      - tmp/reports/graphql_authz_coverage.json
    expire_in: 13 mos
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - app/graphql/**/*
        - lib/gitlab/graphql/**/*
        - app/controllers/graphql_controller.rb
        - "**/*resolver*"

graphql-authorize-cop:
  image: ruby:3.2-bookworm
  stage: test
  before_script:
    - bundle install
  script:
    - bundle exec rubocop --only Graphql/AuthorizeMutation
  rules:
    - if: $CI_PIPELINE_SOURCE

ruby-ratchet-fixture-fail:
  image: ruby:3.2-bookworm
  stage: test
  before_script:
    - apt-get update && apt-get install -y nodejs npm
    - npm install
  script:
    - source scripts/utils.sh
    - log_info "Verifying Ruby ratchet gate fails on over-limit fixture"
    - |
      set +e
      node scripts/architecture/check_ruby_ratchet.mjs \
        --rubocop-json fixtures/architecture/rubocop-over-limit.json \
        --reports-dir reports/architecture/ruby-fixture-fail
      exit_code=$?
      set -e
      if [ "$exit_code" -ne 1 ]; then
        log_error "Expected Ruby ratchet gate to exit 1 for over-limit fixture, got $exit_code"
        exit 1
      fi
      log_info "Ruby ratchet gate correctly failed on over-limit fixture"
  artifacts:
    name: ruby-ratchet-fixture-fail-report
    paths:
      - reports/architecture/ruby-fixture-fail/ruby-ratchet-report.json
    expire_in: 31d
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE
