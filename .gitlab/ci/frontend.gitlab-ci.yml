# Frontend CI jobs for build baseline capture, validation, and dual-bundler parity.

.frontend-test-base:
  image: node:22-bookworm
  before_script:
    - yarn install --frozen-lockfile || yarn install
  cache:
    key: frontend-yarn
    paths:
      - node_modules/

build-webpack:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Building production assets with webpack 4"
    - NODE_ENV=production node node_modules/webpack/bin/webpack.js --config config/webpack.config.js
  artifacts:
    name: webpack-dist
    paths:
      - dist/webpack/
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

build-rspack:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Building production assets with Rspack"
    - NODE_ENV=production node node_modules/@rspack/cli/bin/rspack.js build --config config/rspack.config.mjs
  artifacts:
    name: rspack-dist
    paths:
      - dist/rspack/
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

bundle-parity:
  extends: .frontend-test-base
  stage: test
  needs:
    - job: build-webpack
      artifacts: true
    - job: build-rspack
      artifacts: true
  script:
    - source scripts/utils.sh
    - log_info "Comparing webpack and Rspack asset manifests"
    - |
      node scripts/frontend/compare_bundles.mjs \
        --manifest-a dist/webpack/asset-manifest.json \
        --manifest-b dist/rspack/asset-manifest.json \
        --output-a dist/webpack \
        --output-b dist/rspack \
        --bundler-a webpack4 \
        --bundler-b rspack
  artifacts:
    name: bundle-parity-reports
    paths:
      - reports/parity/diff-report.md
      - reports/parity/size-table.json
      - reports/parity/parity-defects.json
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

build-baseline:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Recording webpack 4 build baseline"
    - node scripts/frontend/record_build_baseline.mjs
    - node scripts/frontend/validate_baseline.mjs
  artifacts:
    name: webpack4-baseline
    paths:
      - config/parity/webpack4-baseline.json
      - dist/webpack/
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

validate-baseline-schema:
  extends: .frontend-test-base
  stage: test
  script:
    - node scripts/frontend/validate_baseline.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE

size-budget:
  extends: .frontend-test-base
  stage: test
  needs:
    - job: build-webpack
      artifacts: true
  script:
    - source scripts/utils.sh
    - log_info "Checking per-entry bundle size budget against webpack 4 baseline"
    - |
      node scripts/frontend/check_size_budget.mjs \
        --manifest dist/webpack/asset-manifest.json \
        --output dist/webpack
  artifacts:
    name: size-budget-report
    paths:
      - reports/parity/size-budget-report.json
      - reports/parity/size-budget-report.md
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

size-budget-fixture-fail:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Verifying size budget gate fails on oversized fixture entry"
    - |
      set +e
      node scripts/frontend/check_size_budget.mjs \
        --baseline fixtures/frontend/budget/baseline-entry-totals.json \
        --current-totals fixtures/frontend/budget/current-over-budget.json \
        --reports-dir reports/parity/fixture-fail \
        --skip-rebaseline-check
      exit_code=$?
      set -e
      if [ "$exit_code" -ne 1 ]; then
        log_error "Expected size budget gate to exit 1 for oversized fixture, got $exit_code"
        exit 1
      fi
      log_info "Size budget gate correctly failed on oversized fixture"
  artifacts:
    name: size-budget-fixture-fail-report
    paths:
      - reports/parity/fixture-fail/size-budget-report.json
      - reports/parity/fixture-fail/size-budget-report.md
    expire_in: 31d
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE

runtime-smoke:
  extends: .frontend-test-base
  stage: test
  needs:
    - job: build-webpack
      artifacts: true
    - job: build-rspack
      artifacts: true
    - job: bundle-parity
      artifacts: true
  script:
    - source scripts/utils.sh
    - log_info "Running runtime smoke suite against webpack and Rspack outputs"
    - |
      node scripts/frontend/smoke_entry_points.mjs \
        --asset-root dist/webpack \
        --bundler webpack4 \
        --output reports/parity/smoke-results-webpack4.json
    - |
      node scripts/frontend/smoke_entry_points.mjs \
        --asset-root dist/rspack \
        --bundler rspack \
        --output reports/parity/smoke-results-rspack.json
    - |
      node scripts/frontend/smoke_entry_points.mjs \
        --mode diff \
        --results-a reports/parity/smoke-results-webpack4.json \
        --results-b reports/parity/smoke-results-rspack.json \
        --reports-dir reports/parity \
        --parity-defects reports/parity/parity-defects.json
  artifacts:
    name: runtime-smoke-reports
    paths:
      - reports/parity/smoke-results-webpack4.json
      - reports/parity/smoke-results-rspack.json
      - reports/parity/smoke-divergence-report.json
      - reports/parity/parity-defects.json
    expire_in: 31d
  rules:
    - if: $CI_PIPELINE_SOURCE

runtime-smoke-fixtures:
  extends: .frontend-test-base
  stage: test
  script:
    - source scripts/utils.sh
    - log_info "Validating smoke harness against committed passing and failing fixtures"
    - |
      node scripts/frontend/smoke_entry_points.mjs \
        --asset-root fixtures/frontend/smoke/passing \
        --bundler fixture-pass \
        --output reports/parity/smoke-results-fixture-pass.json
    - |
      set +e
      node scripts/frontend/smoke_entry_points.mjs \
        --asset-root fixtures/frontend/smoke/failing \
        --bundler fixture-fail \
        --output reports/parity/smoke-results-fixture-fail.json
      exit_code=$?
      set -e
      if [ "$exit_code" -ne 1 ]; then
        log_error "Expected smoke harness to exit 1 for failing fixture, got $exit_code"
        exit 1
      fi
      log_info "Smoke harness correctly failed on failing fixture"
  artifacts:
    name: runtime-smoke-fixture-reports
    paths:
      - reports/parity/smoke-results-fixture-pass.json
      - reports/parity/smoke-results-fixture-fail.json
    expire_in: 31d
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE

frontend-unit-tests:
  extends: .frontend-test-base
  stage: test
  script:
    - yarn test
  rules:
    - if: $CI_PIPELINE_SOURCE
